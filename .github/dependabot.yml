# Keeps the actions used by .github/workflows up to date.
#
# They are pinned to commit hashes there, so nothing moves under the workflow
# on its own; the cost of that is a pin that silently goes stale, which is
# what this file is for.  Dependabot reads the version from the comment after
# each hash, and rewrites the hash and the comment together.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      # There are two actions and the workflow is run on demand, so anything
      # more frequent is just pull requests nobody needs to read.
      interval: monthly
    groups:
      # One pull request for all of them rather than one each.
      actions:
        patterns:
          - "*"
