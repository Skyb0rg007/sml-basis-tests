# Runs the suite on the three implementations that can build it, and publishes
# what each of them reported as a Markdown file.
#
# Nothing is built from source here.  MLton and Poly/ML come from Ubuntu, and
# SML/NJ from the openSUSE Build Service repository that packages it for
# Debian and Ubuntu.  Building any of them would take longer than the whole
# test run.
#
# MLKit is not among them.  src/compat/compat-mlkit.sml supplies the seven
# required members MLKit 4.7.22 lacks, and with it MLKit type-checks the whole
# suite, but its back end then dies with "Impossible: CompileDec.succeed" --
# an internal compiler error no change to this suite can address.  There is
# nothing for a run to report, so it does not run.  run/mlkit.sh and
# tools/ci-run.sh still know how, for whenever that is fixed.
#
# Manual trigger only: a full run builds three compilers' worth of the suite,
# and its output is a report to be read rather than a signal to be watched.
#
# A failing test does not fail this workflow.  The suite exists to find
# defects in the implementations it runs on, and all three have some; a red
# build every time would say nothing.  What does fail the workflow is a
# compiler that cannot build the suite at all, since then nothing was
# learned.
name: Basis conformance

on:
  workflow_dispatch:
    inputs:
      seed:
        description: Seed for the random generator
        default: "20260101"
      trials:
        description: Trials per property
        default: "100"

permissions:
  contents: read

jobs:
  conformance:
    name: Three implementations
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      SEED: ${{ inputs.seed }}
      TRIALS: ${{ inputs.trials }}

    steps:
      # The actions are pinned to a commit rather than a tag: a tag can be
      # moved to point at different code, a commit cannot.  The version in the
      # trailing comment is what Dependabot reads and rewrites, which is the
      # only reason it is there -- see .github/dependabot.yml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install MLton and Poly/ML
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mlton polyml

      - name: Install SML/NJ from the openSUSE Build Service
        run: |
          # The repository is laid out per distribution release, so the path
          # follows the runner rather than being pinned alongside it.
          release="xUbuntu_$(lsb_release -rs)"
          key=/etc/apt/keyrings/home_skyenet_smlnj.gpg
          sudo install -d -m 0755 /etc/apt/keyrings
          curl -fsSL "https://download.opensuse.org/repositories/home:skyenet:smlnj/${release}/Release.key" \
            | gpg --dearmor | sudo tee "$key" > /dev/null
          echo "deb [signed-by=$key] https://download.opensuse.org/repositories/home:/skyenet:/smlnj/${release}/ /" \
            | sudo tee /etc/apt/sources.list.d/home-skyenet-smlnj.sources > /dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends smlnj

      - name: Report the versions installed
        run: |
          sml @SMLversion
          mlton 2>&1 | head -1
          poly -v | head -1

      # Each run records its own outcome and does not stop the ones after it,
      # so one implementation failing to build still leaves a full report for
      # the other two.
      - name: SML/NJ
        run: tools/ci-run.sh smlnj ci-results --seed "$SEED" --trials "$TRIALS"
      - name: MLton
        run: tools/ci-run.sh mlton ci-results --seed "$SEED" --trials "$TRIALS"
      - name: Poly/ML
        run: tools/ci-run.sh polyml ci-results --seed "$SEED" --trials "$TRIALS"

      - name: Write the report
        run: |
          CI_HOST="${{ runner.os }} ${{ runner.arch }}, ubuntu-24.04" \
            tools/ci-report.sh ci-results > ci-results/conformance.md
          cat ci-results/conformance.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the report and the raw logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conformance-report
          path: ci-results/

      - name: Fail only if a compiler could not build the suite
        run: |
          rc=0
          for id in smlnj mlton polyml; do
            if [ "$(cat ci-results/$id.status)" != completed ]; then
              echo "::error::$id could not build the suite"
              rc=1
            fi
          done
          exit $rc
